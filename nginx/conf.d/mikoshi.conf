upstream backend {
    # When running in docker-compose, the service name 'backend' resolves on the default network
    server backend:8000;
}

# The public list endpoints are token-free and return the same JSON for every
# viewer, so nginx can hold them itself and absorb traffic spikes. The backend
# already emits Cache-Control: public, s-maxage=...; this layer adds a shared
# cache in front of it.
proxy_cache_path /var/cache/nginx/public
    levels=1:2
    keys_zone=public_lists:20m
    max_size=512m
    inactive=10m
    use_temp_path=off;

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name yubandao.com www.yubandao.com;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Primary HTTPS server
server {
    listen 443 ssl http2;
    server_name yubandao.com www.yubandao.com;

    # SSL certificates (full chain) and key
    # Make sure this directory is mounted into the container at /etc/nginx/yubandao.com_nginx
    ssl_certificate     /etc/nginx/yubandao.com_nginx/yubandao.com_bundle.crt;
    ssl_certificate_key /etc/nginx/yubandao.com_nginx/yubandao.com.key;

    # Reasonable TLS defaults
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Enforce HSTS (only over HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Optionally keep root/index if you later choose to serve built files directly from Nginx
    root /usr/share/nginx/html;
    index index.html;

    # /api/chat is the SSE streaming endpoint. It must not be buffered (each
    # token chunk is forwarded to the client the instant it arrives instead of
    # nginx collecting the whole response first), and it needs proxy timeouts
    # well past worst-case generation time so nginx never cuts off a
    # still-healthy stream at its 60s default. Exact match so buffering and
    # default timeouts are preserved for every other /api/ endpoint.
    location = /api/chat {
        proxy_pass http://backend;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Shared cache for the anonymous public lists. A request that carries an
    # Authorization header is always personal (per-user like flags), so it
    # bypasses the cache and is never stored.
    location ~ ^/api/(characters|scenes|personas)/(popular|recent)$ {
        proxy_pass http://backend;
        proxy_cache public_lists;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Serve uploaded images directly from the shared host mount.
    location /static/images/ {
        alias /srv/static-images/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Keep non-image backend static paths proxied for compatibility during migration.
    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy all other requests to the frontend service (static shell on port 3000).
    # Note: We proxy EVERYTHING (except /api and /static) to the frontend, including assets.
    # This avoids Nginx trying to serve files from its own filesystem when we are not mounting the build into Nginx.
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output is immutable, so it can be cached for a year.
    location /assets/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 阿里云人机验证码配置 -->
  <script>
    window.AliyunCaptchaConfig = {
      region: "cn",
      prefix: "yywvva",
    };
  </script>
  <script
    type="text/javascript"
    src="https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js"
  ></script>
  
  <meta name="baidu-site-verification" content="codeva-hFbGhrI3NF" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/>
  <title>语伴岛 | AI聊天与角色卡创作社区</title>
  <meta name="description" content="语伴岛是一个AI角色互动与创作社区，支持AI聊天、角色卡创建与分享。探索不同的角色与故事，也可以打造自己的角色，开启一段段独特的对话。无需下载App，手机电脑均可使用。" />
  <!-- Subtle light-lavender theme color for browser UI on mobile -->
  <meta name="theme-color" content="#f5f5f7" />
  <!-- Prevent password managers from triggering layout shift -->
  <meta name="password-managers" content="false" />
  <!-- Favicon and app icons (placed in frontend/public/) -->
  <!-- Root-absolute paths keep these resolvable on nested SPA routes. -->
  <!-- The ICO plus an explicit PNG covers WebView-based browsers (e.g. Via on
       Android), which do not reliably parse SVG-only or PNG-only icon tags. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <!-- Apple Touch Icon (iOS home screen shortcut / Chrome iOS) -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- Web App Manifest (Android + PWA install for all platforms) -->
  <link rel="manifest" href="/manifest.json" />
  <!-- Start the anonymous popular-list request in parallel with the JS bundle.
       The response is token-free and cached, so this is the one place where a
       tiny bit of server-known work beats waiting for hydration.
       No `crossorigin` here: it must match the credentials mode of the inline
       fetch below, otherwise the browser downloads the list twice. -->
  <link rel="preload" as="fetch"
        href="/api/characters/popular?short=false&page=1&page_size=20" />
  <script>
    try {
      window.__POPULAR_LIST_PRELOAD__ = fetch(
        '/api/characters/popular?short=false&page=1&page_size=20'
      ).then(function (response) {
        return response.ok ? response.json() : null;
      });
    } catch (e) {
      /* the SPA fetches the list itself if the preload fails */
    }
  </script>
</head>
<body>
  <style>
    /* Fix scrolling issues on iOS */
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    body {
      /*
        Elegant, muted lavender on white:
        - Keep most of the canvas white
        - Add a lavender glow at the bottom and softly on both sides (more visible)
      */
      background-color: #fcfcfc;
      background-image: none;
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    
    #root {
      width: 100%;
      height: 100%;
    }
  </style>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
